version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      ALLOWED_ORIGINS: 'http://localhost:3001,http://localhost:5500'
      AUTH_WINDOW_MS: 600000
      AUTH_MAX_ATTEMPTS: 10
    volumes:
      - ./backend/database.sqlite:/app/backend/database.sqlite
      - ./backend/backups:/app/backend/backups
    restart: unless-stopped

# Para usar:
# docker-compose up --build

# Ou em produção com nginx:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    depends_on:
      - app
    # Descomente se usar SSL
    # depends_on:
    #   - app
